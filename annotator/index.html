<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>電梯車廂標記工具</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1b2430;--muted:#5b6675;--line:#d8dde3;--accent:#0b6bcb;--accent-ink:#fff;--ok:#1a7f4b;--okbg:#e6f4ec;--warn:#b25e00;--warnbg:#fff1dd;--bad:#b3261e;--chip:#eceff3;--esc:#8a3ffc}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b222b;--ink:#e8edf3;--muted:#9aa6b5;--line:#2c3643;--accent:#5aa6ff;--accent-ink:#06121f;--ok:#5fd394;--okbg:#14301f;--warn:#f0b35a;--warnbg:#38280f;--bad:#ff8f87;--chip:#27303b;--esc:#b794ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif}
.banner{background:var(--warn);color:#fff;text-align:center;padding:5px 10px;font-weight:700;font-size:.85rem}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:6}
header h1{font-size:1.05rem;margin:0}
.grow{flex:1}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;min-width:120px;flex:1;max-width:300px}
.bar i{display:block;height:100%;background:var(--ok)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 12px;min-height:36px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.esc{background:var(--esc);color:#fff;border-color:var(--esc)}
.btn.danger{color:var(--bad)}
#now{position:sticky;top:53px;z-index:5;background:var(--accent);color:var(--accent-ink);padding:10px 16px;font-weight:600}
#now small{display:block;font-weight:400;opacity:.9}
#now.done{background:var(--ok);color:#fff}
.wrap{display:grid;grid-template-columns:260px 1fr;gap:16px;padding:16px;max-width:1200px;margin:0 auto}
@media (max-width:820px){.wrap{grid-template-columns:1fr}.side{max-height:220px}}
.side{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:calc(100vh - 170px);position:sticky;top:120px;align-self:start}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
.lh{padding:5px 10px;font-weight:700;font-size:.85rem;color:#fff}
.row{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--chip)} .row.cur{background:var(--accent);color:var(--accent-ink)}
.row .code{font-size:.8rem;opacity:.7;width:44px}.row .st{flex:1}
.pill{font-size:.75rem;border-radius:99px;padding:0 8px;background:var(--chip);color:var(--ink)}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.warn{background:var(--warnbg);color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card.focus{border:2px solid var(--accent)}
.card h2{font-size:1.05rem;margin:0 0 8px}
.badge{display:inline-block;color:#fff;border-radius:6px;padding:0 8px;font-size:.85rem;font-weight:700;margin-right:6px}
.ref{background:var(--chip);border-radius:8px;padding:8px 10px;font-size:.9rem;white-space:pre-line;margin:6px 0}
.ref b{display:block;font-size:.8rem;color:var(--muted)}
.en{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0}
.en.done{border-color:var(--ok)} .en.cursor{outline:3px solid var(--accent);background:var(--chip)}
.en.t-escalator{border-left:5px solid var(--esc)} .en.t-elevator{border-left:5px solid var(--accent)}
.fld{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:5px 0}
.fld>label{font-size:.85rem;color:var(--muted);min-width:44px}
input[type=text],select{min-height:36px;padding:3px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
input.label{flex:1;min-width:150px}
.nb{min-width:42px;min-height:42px;border:1px solid var(--line);background:var(--bg);border-radius:8px;font-weight:700;font-size:1.05rem}
.nb.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nb.on.s{background:var(--esc);border-color:var(--esc);color:#fff}
.nb.sm{min-width:36px;min-height:36px;font-size:.9rem}
.train{display:flex;gap:3px;margin:8px 0 2px}
.train div{flex:1;text-align:center;border-radius:5px;padding:2px 0;background:var(--chip);font-size:.8rem;min-height:42px}
.train div small{display:block;font-size:.7rem;font-weight:700;min-height:14px}
.train div.hit{outline:2px solid var(--accent)}
.train .e{color:var(--accent)} .train .s{color:var(--esc)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.hint{color:var(--muted);font-size:.85rem}
.escbox{border:2px dashed var(--esc);border-radius:10px;padding:8px 10px;margin:8px 0}
.escbox.cursor{background:var(--chip);outline:3px solid var(--esc)}
kbd{background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:.85rem}
#status{font-size:.85rem;color:var(--muted)} #status.err{color:var(--bad);font-weight:700}
#flash{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#flash.on{opacity:.95}
</style>
</head>
<body>
<div class="banner">內部資料標記工具・非正式產品・僅限本機（127.0.0.1）使用</div>
<header>
  <h1>電梯／手扶梯 ↔ 車廂</h1>
  <div class="bar" title="已完成的方向"><i id="bar"></i></div>
  <span id="prog" class="hint"></span>
  <span class="grow"></span>
  <label class="hint"><input type="checkbox" id="auto" checked> 完成後自動跳下一站</label>
  <label class="hint" title="標一個方向，另一個方向自動帶入對稱車廂（第 k 節 ↔ 第 N+1−k 節）。島式月台適用；兩側月台請在該站按 M 關閉"><input type="checkbox" id="mirror" checked> 自動鏡射</label>
  <span id="status">載入中…</span>
  <button class="btn" id="undo" title="Z 或 Backspace">復原 (Z)</button>
  <button class="btn" id="next" title="N">下一個未完成 (N)</button>
  <button class="btn" id="csv">匯出 CSV</button>
  <button class="btn" id="json">匯出 JSON</button>
</header>
<div id="now"></div>
<div class="wrap">
  <aside class="side"><div class="filters" id="filters"></div><div id="list"></div></aside>
  <main id="ed"></main>
</div>
<div id="flash"></div>
<script src="data.js"></script>
<script>
const D=window.METRO_DATA,S=D.stations;
const COLOR={'文湖線':'#c48c31','淡水信義線':'#e3002c','松山新店線':'#008659','中和新蘆線':'#f8b61c','板南線':'#0070bd'};
const DARK=new Set(['中和新蘆線']);
const LINES=Object.keys(COLOR);
// 標記範圍設定
const SKIP_STATIONS=new Set(['松山新店線|小碧潭']);   // 不標的車站（支線）
const SKIP_VIA=new Set(['松山新店線|小碧潭']);        // 不標的方向（例如七張往小碧潭）
const REVERSE=new Set([]);                            // 想讓某條線改成由終點往起點標，就把線名放進來（目前都用原本的站碼順序）
const DIR_FIRST={'中和新蘆線':'迴龍','板南線':'頂埔'};  // 該線的方向卡片順序：標籤含這個字的方向排最前面（迴龍／蘆洲 → 南勢角；頂埔 → 南港展覽館）
const SOURCES=['捷運Go','現場','站內平面圖','鏡射推算','其他'];
const carsOf=l=>l==='文湖線'?4:6;
const $=id=>document.getElementById(id);
const esc=s=>(s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TYPE={elevator:'電梯',escalator:'手扶梯'};

// ---------- graph / directions
const G={};
for(const [l,a,b] of D.edges){(G[l] ||= {});(G[l][a] ||= new Set()).add(b);(G[l][b] ||= new Set()).add(a);}
function termini(l,from,via){let prev=from,cur=via;for(let i=0;i<80;i++){const nx=[...G[l][cur]].filter(x=>x!==prev&&!SKIP_VIA.has(l+'|'+x));
  if(!nx.length)return [cur]; if(nx.length>1)return nx.flatMap(x=>termini(l,cur,x)); prev=cur;cur=nx[0];}return [cur];}
function dirsOf(s,l){return [...(G[l]?.[s]||[])].filter(v=>!SKIP_VIA.has(l+'|'+v)).map(v=>({via:v,label:'往 '+[...new Set(termini(l,s,v))].join('／')})).sort((a,b)=>{const f=DIR_FIRST[l];if(f){const fa=a.label.includes(f),fb=b.label.includes(f);if(fa!==fb)return fa?-1:1;}return a.label.localeCompare(b.label,'zh-Hant');});}
const keyOf=(s,l,v)=>`${s}|${l}|${v}`;

// ---------- rows
const codeNum=c=>{const m=c.match(/(\d+)([A-Z]?)/);return +m[1]*10+(m[2]?m[2].charCodeAt(0)-64:0);};
const ROWS=[];
for(const l of LINES) for(const n of Object.keys(S)) if(S[n].lines[l]&&!SKIP_STATIONS.has(l+'|'+n)) ROWS.push({n,l,code:S[n].lines[l].code});
ROWS.sort((a,b)=>LINES.indexOf(a.l)-LINES.indexOf(b.l)||(codeNum(a.code)-codeNum(b.code))*(REVERSE.has(a.l)?-1:1));

let doc={version:3,items:{},mirrorOff:{}}, cur=null, filter='all', onlyTodo=false, history=[];
const elevs=it=>it.entries.filter(e=>e.type==='elevator');
const escs=it=>it.entries.filter(e=>e.type==='escalator');
// 完成＝（有電梯，或確認沒有電梯）且（有手扶梯，或確認沒有手扶梯），而且每筆都有車廂
const done=it=>!!it&&it.entries.every(e=>e.car)&&(elevs(it).length>0||!!it.elevatorNone)&&(escs(it).length>0||!!it.escalatorNone);
const rowStat=r=>{const ds=dirsOf(r.n,r.l);return {d:ds.filter(x=>done(doc.items[keyOf(r.n,r.l,x.via)])).length,t:ds.length};};
const newEntry=(type,label='',car=null,extra={})=>({type,label,car,door:null,flow:null,source:'捷運Go',verified:false,mirrored:false,note:'',...extra});

// 官方文字是否表示這裡有（月台）電梯；以及要開幾個標記窗口
const hasElevator=info=>!!((info.platElev||'').trim()||/月[臺台]/.test(info.exitElev||'')||/月[臺台]電梯/.test(info.raw||''));
function slotsFor(info){
  const t=(info.platElev||'').replace(/月台/g,'月臺').trim();
  const segs=t.split(/\n/).map(x=>x.trim()).filter(x=>x&&!/^(月臺電梯|出口電梯)[:：]?$/.test(x));
  return segs.length?segs.slice(0,3):[''];
}
// 選到車站時自動開好窗口：確定有電梯 → 電梯窗口；手扶梯預設一定有一個窗口（電梯標完直接跳到它）
function openDrafts(n,l){
  const info=S[n].lines[l];
  for(const d of dirsOf(n,l)){const k=keyOf(n,l,d.via);
    if(doc.items[k])continue;
    const entries=hasElevator(info)?slotsFor(info).map(t=>newEntry('elevator',t)):[];
    entries.push(newEntry('escalator','手扶梯'));
    doc.items[k]={station:n,line:l,via:d.via,dir:d.label,elevatorNone:false,escalatorNone:false,entries};}
}
const ensure=(s,l,v,label)=>doc.items[keyOf(s,l,v)] ||= {station:s,line:l,via:v,dir:label,elevatorNone:false,escalatorNone:false,entries:[]};

// ---------- cursor：下一個要輸入的東西
function cursorFor(sel){
  if(!sel)return null;
  for(const d of dirsOf(sel.n,sel.l)){const it=doc.items[keyOf(sel.n,sel.l,d.via)];
    if(!it){return {d,kind:'needEl'};}
    const idx=it.entries.findIndex(e=>!e.car);
    if(idx>=0)return {d,kind:'entry',idx};
    if(!elevs(it).length&&!it.elevatorNone)return {d,kind:'needEl'};
    if(!escs(it).length&&!it.escalatorNone)return {d,kind:'needEsc'};
  }
  return null;
}

// ---------- persistence
let timer=null;
function save(){clearTimeout(timer);timer=setTimeout(async()=>{
  doc.updated=new Date().toISOString();
  try{const r=await fetch('/api/annotations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(doc)});
    if(!r.ok)throw new Error(r.status);$('status').className='';$('status').textContent='已儲存 '+new Date().toLocaleTimeString();}
  catch(e){$('status').className='err';$('status').textContent='⚠ 儲存失敗（伺服器沒開？）';}
},300);}
function flash(msg){const f=$('flash');f.textContent=msg;f.classList.add('on');clearTimeout(flash.t);flash.t=setTimeout(()=>f.classList.remove('on'),1400);}

// 所有修改都經過 mutate，才能復原
function snapshot(s,l){return dirsOf(s,l).map(d=>{const k=keyOf(s,l,d.via);return [k,doc.items[k]?JSON.stringify(doc.items[k]):null];});}
function restore(snaps){for(const [k,str] of snaps){if(str)doc.items[k]=JSON.parse(str);else delete doc.items[k];}}
function mutate(s,l,v,label,fn){
  history.push({snaps:snapshot(s,l),mirrorOff:{...doc.mirrorOff},sel:cur&&{...cur}}); if(history.length>200)history.shift();
  fn(ensure(s,l,v,label)); autoMirror(s,l); save(); refresh();
}
function undo(){const h=history.pop(); if(!h)return flash('沒有可復原的動作');
  restore(h.snaps); doc.mirrorOff=h.mirrorOff; if(h.sel)cur=h.sel; save(); refresh(); flash('已復原');}

// ---------- 鏡射（預設開啟）：同一部電梯／手扶梯在兩個方向，車廂號碼是對稱的（第 k 節 ↔ 第 N+1-k 節）
// 只適用島式月台；兩側月台的車站按 M 關閉本站鏡射。
const mirrorOn=(n,l)=>$('mirror').checked&&!doc.mirrorOff[n+'|'+l];
function fillDrafts(it,n,l){ // 補回窗口：電梯（官方有描述才補）與手扶梯
  const info=S[n].lines[l];
  if(!elevs(it).length&&!it.elevatorNone&&hasElevator(info))it.entries.unshift(...slotsFor(info).map(t=>newEntry('elevator',t)));
  if(!escs(it).length&&!it.escalatorNone)it.entries.push(newEntry('escalator','手扶梯'));
}
function autoMirror(n,l){
  if(!mirrorOn(n,l))return;
  const ds=dirsOf(n,l); if(ds.length!==2)return;
  const its=ds.map(d=>doc.items[keyOf(n,l,d.via)]); if(!its[0]||!its[1])return;
  const N=carsOf(l);
  // 電梯、手扶梯各自判斷：只有「一邊是自己標的、另一邊還沒標」才鏡射
  for(const type of ['elevator','escalator']){
    const none=type==='elevator'?'elevatorNone':'escalatorNone', mk=type==='elevator'?'el':'esc';
    const userSet=it=>it.entries.some(e=>e.type===type&&e.car&&!e.mirrored)||(!!it[none]&&!it.mf?.[mk]);
    const u0=userSet(its[0]),u1=userSet(its[1]); if(u0===u1)continue;
    const src=its[u0?0:1],dst=its[u0?1:0];
    const mir=src.entries.filter(e=>e.type===type&&e.car&&!e.mirrored)
      .map(e=>newEntry(type,e.label,N+1-e.car,{flow:e.flow,source:'鏡射推算',mirrored:true,note:'鏡射自另一方向，需核對'}));
    dst.mf ||= {el:false,esc:false}; dst.mf[mk]=false; dst[none]=false;
    let keep=mir.length?[]:dst.entries.filter(e=>e.type===type&&!e.mirrored&&!e.car);
    if(!mir.length&&src[none]){dst[none]=true;dst.mf[mk]=true;keep=[];}
    const others=dst.entries.filter(e=>e.type!==type);
    dst.entries=type==='elevator'?[...mir,...keep,...others]:[...others,...mir,...keep];
  }
}
function toggleMirror(){
  if(!cur)return; const {n,l}=cur, k=n+'|'+l;
  history.push({snaps:snapshot(n,l),mirrorOff:{...doc.mirrorOff},sel:{...cur}});
  if(doc.mirrorOff[k]){delete doc.mirrorOff[k];autoMirror(n,l);flash('本站鏡射：開');}
  else{doc.mirrorOff[k]=true;
    for(const d of dirsOf(n,l)){const it=doc.items[keyOf(n,l,d.via)];if(!it)continue;
      it.entries=it.entries.filter(e=>!e.mirrored); if(it.mf?.el)it.elevatorNone=false; if(it.mf?.esc)it.escalatorNone=false; it.mf=null; fillDrafts(it,n,l);}
    flash('本站鏡射：關（兩個方向要各自標）');}
  save();refresh();
}
function refresh(){renderList();renderEditor();renderNow();
  if(cur&&!cursorFor(cur)&&$('auto').checked){const sel=cur;setTimeout(()=>{if(cur===sel&&!cursorFor(cur))nextTodo();},350);}}

// ---------- render
function renderList(){
  $('filters').innerHTML=['all',...LINES].map(l=>`<button class="btn" style="min-height:28px;padding:1px 8px;${filter===l?'background:var(--accent);color:var(--accent-ink)':''}" data-f="${l}">${l==='all'?'全部':l.replace('線','')}</button>`).join('')+
   `<label class="hint" style="display:flex;gap:4px;align-items:center"><input type="checkbox" id="todo" ${onlyTodo?'checked':''}>只看未完成</label>`;
  let h='',last='';
  for(const r of visibleRows()){const st=rowStat(r);
    if(r.l!==last){last=r.l;h+=`<div class="lh" style="background:${COLOR[r.l]};${DARK.has(r.l)?'color:#222':''}">${r.l}</div>`;}
    const isCur=cur&&cur.n===r.n&&cur.l===r.l;
    h+=`<div class="row ${isCur?'cur':''}" data-n="${esc(r.n)}" data-l="${r.l}"><span class="code">${r.code}</span><span class="st">${esc(r.n)}</span><span class="pill ${st.d===st.t?'ok':''}">${st.d}/${st.t}</span></div>`;}
  $('list').innerHTML=h||'<div class="row hint">沒有符合的車站</div>';
  $('todo')?.addEventListener('change',e=>{onlyTodo=e.target.checked;renderList();});
  let td=0,tt=0;for(const r of ROWS){const s=rowStat(r);td+=s.d;tt+=s.t;}
  const pend=Object.values(doc.items).reduce((a,it)=>a+it.entries.filter(e=>e.mirrored&&!e.verified).length,0);
  $('bar').style.width=(tt?td/tt*100:0)+'%';$('prog').textContent=`${td} / ${tt} 個方向${pend?`（鏡射待核對 ${pend}）`:''}`;
  $('list').querySelector('.row.cur')?.scrollIntoView({block:'nearest'});
}
function visibleRows(){return ROWS.filter(r=>(filter==='all'||r.l===filter)&&(!onlyTodo||(s=>s.d<s.t)(rowStat(r))));}
function trainHTML(l,entries){
  const n=carsOf(l);
  return `<div class="train">${Array.from({length:n},(_,i)=>{
    const here=entries.filter(e=>e.car===i+1);
    const tags=here.map(e=>e.type==='elevator'?'<span class="e">梯</span>':`<span class="s">扶${e.flow==='up'?'↑':e.flow==='down'?'↓':''}</span>`).join(' ');
    return `<div class="${here.length?'hit':''}">${i+1}<small>${tags}</small></div>`;}).join('')}</div>
    <div class="hint">← 車頭（該方向行進方向）　車尾 →</div>`;
}
function entryHTML(e,i,l,isCursor){
  const N=carsOf(l), s=e.type==='escalator';
  return `<div class="en t-${e.type} ${e.car?'done':''} ${isCursor?'cursor':''}" data-i="${i}">
    <div class="fld"><b>${TYPE[e.type]}</b>
      <input type="text" class="label" data-fld="label" value="${esc(e.label)}" placeholder="位置說明（可略）">
      ${s?`<button class="nb sm ${e.flow==='up'?'on s':''}" data-act="flow" data-n="up" title="上行">↑</button><button class="nb sm ${e.flow==='down'?'on s':''}" data-act="flow" data-n="down" title="下行">↓</button>`:''}
      <button class="btn danger" data-act="del">刪除</button></div>
    <div class="fld"><label>車廂</label>${Array.from({length:N},(_,j)=>`<button class="nb ${e.car===j+1?'on '+(s?'s':''):''}" data-act="car" data-n="${j+1}">${j+1}</button>`).join('')}
      <span class="hint">／車門</span><button class="nb sm ${!e.door?'on':''}" data-act="door" data-n="0">—</button>${[1,2,3,4].map(j=>`<button class="nb sm ${e.door===j?'on':''}" data-act="door" data-n="${j}">${j}</button>`).join('')}</div>
    <div class="fld"><label>來源</label><select data-fld="source">${SOURCES.map(x=>`<option ${e.source===x?'selected':''}>${x}</option>`).join('')}</select>
      <label style="min-width:0"><input type="checkbox" data-fld="verified" ${e.verified?'checked':''}> 已核對</label>
      ${e.mirrored?'<span class="pill warn">鏡射，需核對</span>':''}
      <input type="text" class="label" data-fld="note" value="${esc(e.note)}" placeholder="備註"></div></div>`;
}
function renderEditor(){
  if(!cur){$('ed').innerHTML='<div class="card">請從左邊選擇車站，或按 <kbd>N</kbd>。</div>';return;}
  const {n,l}=cur, info=S[n].lines[l], dirs=dirsOf(n,l), c=cursorFor(cur);
  let h=`<div class="card"><h2><span class="badge" style="background:${COLOR[l]};${DARK.has(l)?'color:#222':''}">${l}</span>${esc(n)} <span class="hint">${info.code}　每列 ${carsOf(l)} 節</span></h2>
    <div class="ref"><b>官方月台電梯描述</b>${esc(info.platElev||'（無）')}</div>
    <details><summary class="hint">官方出口電梯描述</summary><div class="ref">${esc(info.exitElev||'（無）')}</div></details></div>`;
  for(const d of dirs){
    const k=keyOf(n,l,d.via), it=doc.items[k], isC=c&&c.d.via===d.via, dn=done(it);
    h+=`<div class="card ${isC?'focus':''}" data-card data-s="${esc(n)}" data-l="${l}" data-v="${esc(d.via)}" data-d="${esc(d.label)}">
      <h2>${d.label} <span class="pill ${dn?'ok':''}">${dn?'完成':'未完成'}</span></h2>`;
    if(it&&it.elevatorNone)h+=`<div class="hint">電梯：這個方向沒有 ✓　<button class="btn" data-act="elreopen">重新開啟</button></div>`;
    if(!it)h+=`<div class="hint">（尚未開啟）</div>`;
    (it?it.entries:[]).forEach((e,i)=>{h+=entryHTML(e,i,l,isC&&c.kind==='entry'&&c.idx===i);});
    if(it&&it.escalatorNone)h+=`<div class="hint">手扶梯：這個方向沒有 ✓　<button class="btn" data-act="escreopen">重新開啟</button></div>`;
    if(it&&it.entries.length)h+=trainHTML(l,it.entries);
    h+=`<div class="tools"><button class="btn primary" data-act="add" data-type="elevator">＋ 電梯 (+)</button><button class="btn esc" data-act="add" data-type="escalator">＋ 手扶梯 (E)</button>
      ${dirs.length>1?`<button class="btn" data-act="mirrortoggle" title="島式月台才適用；兩側月台請關閉">本站鏡射：${mirrorOn(n,l)?'開':'關'} (M)</button>`:''}
      <button class="btn" data-act="elnone">沒有電梯 (X)</button><button class="btn" data-act="escnone">沒有手扶梯 (V)</button></div>`;
    h+='</div>';}
  $('ed').innerHTML=h;
}
function renderNow(){
  const el=$('now');
  if(!cur){el.className='';el.innerHTML='選一個車站開始。';return;}
  const c=cursorFor(cur), N=carsOf(cur.l);
  if(!c){el.className='done';el.innerHTML=`✓ ${esc(cur.n)}（${cur.l}）已全部完成<small>按 <kbd>N</kbd> 跳到下一個未完成的車站</small>`;return;}
  el.className='';
  const it=doc.items[keyOf(cur.n,cur.l,c.d.via)];
  let what,hint;
  if(c.kind==='entry'){const e=it.entries[c.idx];
    const nEsc=escs(it).filter(x=>x.car).length, more=e.type==='escalator'&&nEsc>0;
    what=more?`手扶梯：第 ${nEsc+1} 部（已標 ${nEsc} 部）`:`${TYPE[e.type]}${e.type==='elevator'&&e.label?'：'+esc(e.label):''}`;
    hint=more
      ?`還有手扶梯就按 <kbd>1</kbd>–<kbd>${N}</kbd>　・　<kbd>V</kbd> 或 <kbd>空白</kbd> ＝ <b>沒有更多了</b>，完成　・　<kbd>Z</kbd> 復原`
      :`按 <kbd>1</kbd>–<kbd>${N}</kbd> 選車廂　・　<kbd>${e.type==='elevator'?'X':'V'}</kbd> 或 <kbd>空白</kbd> ＝ 這方向沒有${TYPE[e.type]}　・　<kbd>Z</kbd> 復原`;}
  else if(c.kind==='needEsc'){what='手扶梯';hint=`<kbd>E</kbd> 新增手扶梯　・　<kbd>V</kbd> 或 <kbd>空白</kbd> ＝ 沒有手扶梯`;}
  else{what='電梯';hint=`<kbd>+</kbd> 新增電梯　・　<kbd>X</kbd> ＝ 這方向沒有電梯`;}
  el.innerHTML=`${esc(cur.n)} <span style="opacity:.8">${cur.l} ${c.d.label}</span>　▶　${what}<small>${hint}</small>`;
}

// ---------- 動作
function select(n,l){cur={n,l};openDrafts(n,l);
  const before=JSON.stringify(snapshot(n,l)); autoMirror(n,l); if(JSON.stringify(snapshot(n,l))!==before)save(); // 舊資料也補上鏡射
  document.activeElement?.blur?.();refresh();window.scrollTo({top:0});}
function nextTodo(){ // 有選線別時，只在該線內找下一個未完成的站
  const pool=ROWS.filter(r=>filter==='all'||r.l===filter);
  const start=cur?pool.findIndex(r=>r.n===cur.n&&r.l===cur.l):-1;
  for(let k=1;k<=pool.length;k++){const r=pool[(start+k+pool.length)%pool.length];const s=rowStat(r);if(s.d<s.t){select(r.n,r.l);return;}}
  flash(filter==='all'?'🎉 全部完成':'🎉 這條線全部完成');
}
function moveRow(dl){const rows=visibleRows();if(!rows.length)return;let i=cur?rows.findIndex(r=>r.n===cur.n&&r.l===cur.l):-1;i=(i+dl+rows.length)%rows.length;select(rows[i].n,rows[i].l);}
function pressCar(num){
  const c=cursorFor(cur); if(!c)return flash('這個車站已完成，按 N 下一站');
  const N=carsOf(cur.l); if(num>N)return flash(`${cur.l}只有 ${N} 節車廂`);
  mutate(cur.n,cur.l,c.d.via,c.d.label,it=>{
    let marked;
    if(c.kind==='entry'){marked=it.entries[c.idx];marked.car=num;}
    else if(c.kind==='needEsc'){marked=newEntry('escalator','手扶梯',num);it.entries.push(marked);}
    else{marked=newEntry('elevator','',num);it.entries.unshift(marked);}
    if(marked.type==='escalator')ensureEscDraft(it);});
}
// 手扶梯可能有多部：標完一部就自動開下一個窗口，按空白／V 表示沒有更多了
function ensureEscDraft(it){if(!it.entries.some(e=>e.type==='escalator'&&!e.car))it.entries.push(newEntry('escalator','手扶梯'));}
function pressSkip(){ // 這一項不存在
  const c=cursorFor(cur); if(!c)return;
  mutate(cur.n,cur.l,c.d.via,c.d.label,it=>{
    if(c.kind==='entry'){const t=it.entries[c.idx].type;it.entries.splice(c.idx,1);
      if(t==='elevator'&&!elevs(it).length)it.elevatorNone=true;
      if(t==='escalator'&&!escs(it).length)it.escalatorNone=true;}
    else if(c.kind==='needEsc')it.escalatorNone=true;
    else it.elevatorNone=true;});
}
function addEntry(type,v){
  const d=(v?dirsOf(cur.n,cur.l).find(x=>x.via===v):null)||(cursorFor(cur)?.d)||dirsOf(cur.n,cur.l)[0];
  mutate(cur.n,cur.l,d.via,d.label,it=>{
    if(type==='elevator'){it.elevatorNone=false;it.entries.unshift(newEntry('elevator',''));}
    else{it.escalatorNone=false;ensureEscDraft(it);}});
}
function setEscalatorNone(d){
  mutate(cur.n,cur.l,d.via,d.label,it=>{it.entries=it.entries.filter(e=>e.type!=='escalator'||e.car);if(!escs(it).length)it.escalatorNone=true;});
}
function setElevatorNone(d){
  mutate(cur.n,cur.l,d.via,d.label,it=>{it.entries=it.entries.filter(e=>e.type!=='elevator'||e.car);if(!elevs(it).length)it.elevatorNone=true;});
}

// ---------- 事件
document.addEventListener('click',e=>{
  const f=e.target.closest('[data-f]'); if(f){filter=f.dataset.f;cur=null;nextTodo();return;} // 選線別 → 直接跳到該線第一個未完成的站
  const row=e.target.closest('.row[data-n]'); if(row){select(row.dataset.n,row.dataset.l);return;}
  const act=e.target.closest('[data-act]'); if(!act)return;
  const card=act.closest('[data-card]'); if(!card)return;
  const {s,l,v,d}=card.dataset, enDiv=act.closest('.en'), i=enDiv?+enDiv.dataset.i:-1;
  switch(act.dataset.act){
    case 'add': addEntry(act.dataset.type,v);break;
    case 'del': mutate(s,l,v,d,it=>{it.entries.splice(i,1);});break;
    case 'car': mutate(s,l,v,d,it=>{const en=it.entries[i],was=en.car;en.car=+act.dataset.n===en.car?null:+act.dataset.n;en.mirrored=false;
      if(en.type==='escalator'&&en.car&&!was)ensureEscDraft(it);});break;
    case 'door': mutate(s,l,v,d,it=>{it.entries[i].door=+act.dataset.n||null;});break;
    case 'flow': mutate(s,l,v,d,it=>{const en=it.entries[i];en.flow=en.flow===act.dataset.n?null:act.dataset.n;});break;
    case 'mirrortoggle': toggleMirror();break;
    case 'elnone': setElevatorNone({via:v,label:d});break;
    case 'escnone': setEscalatorNone({via:v,label:d});break;
    case 'elreopen': mutate(s,l,v,d,it=>{it.elevatorNone=false;it.entries.unshift(newEntry('elevator',''));});break;
    case 'escreopen': mutate(s,l,v,d,it=>{it.escalatorNone=false;it.entries.push(newEntry('escalator','手扶梯'));});break;
  }
});
document.addEventListener('change',e=>{
  const fld=e.target.dataset.fld,card=e.target.closest('[data-card]'),en=e.target.closest('.en'); if(!fld||!card||!en)return;
  const {s,l,v,d}=card.dataset; ensure(s,l,v,d).entries[+en.dataset.i][fld]=e.target.type==='checkbox'?e.target.checked:e.target.value; save();
});
document.addEventListener('input',e=>{
  const fld=e.target.dataset.fld; if(!fld||e.target.type==='checkbox'||e.target.tagName==='SELECT')return;
  const card=e.target.closest('[data-card]'),en=e.target.closest('.en'); if(!card||!en)return;
  const {s,l,v,d}=card.dataset; ensure(s,l,v,d).entries[+en.dataset.i][fld]=e.target.value; save();
});
document.addEventListener('keydown',e=>{
  const ae=document.activeElement,tag=ae&&ae.tagName;
  if((tag==='INPUT'&&ae.type!=='checkbox')||tag==='SELECT'||tag==='TEXTAREA'){if(e.key==='Enter'||e.key==='Escape')ae.blur();return;}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key, stop=()=>e.preventDefault();
  if(k==='n'||k==='N'){stop();return nextTodo();}
  if(k==='ArrowRight'||k==='ArrowLeft'){stop();return moveRow(k==='ArrowRight'?1:-1);}
  if(k==='z'||k==='Z'||k==='Backspace'){stop();return undo();}
  if(!cur)return;
  if(/^[1-9]$/.test(k)){stop();return pressCar(+k);}
  if(k===' '||k==='0'){stop();return pressSkip();}
  if(k==='+'||k==='='){stop();return addEntry('elevator');}
  if(k==='e'||k==='E'){stop();return addEntry('escalator');}
  if(k==='x'||k==='X'){stop();const c=cursorFor(cur)||{d:dirsOf(cur.n,cur.l)[0]};return setElevatorNone(c.d);}
  if(k==='v'||k==='V'){stop();const c=cursorFor(cur)||{d:dirsOf(cur.n,cur.l)[0]};return setEscalatorNone(c.d);}
  if(k==='m'||k==='M'){stop();return toggleMirror();}
});
// ---------- 匯出
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();}
$('json').onclick=()=>download('annotations.json',JSON.stringify(doc,null,1),'application/json');
$('csv').onclick=()=>{const rows=[['station','line','direction','type','label','car','door','flow','source','verified','mirrored','note']];
  for(const it of Object.values(doc.items)){
    if(it.elevatorNone)rows.push([it.station,it.line,it.dir,'elevator_none','','','','','','','','']);
    if(it.escalatorNone)rows.push([it.station,it.line,it.dir,'escalator_none','','','','','','','','']);
    for(const e of it.entries) if(e.car) rows.push([it.station,it.line,it.dir,e.type,e.label,e.car,e.door||'',e.flow||'',e.source||'',e.verified?1:0,e.mirrored?1:0,e.note||'']);}
  download('annotations.csv','﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv');};
$('next').onclick=nextTodo; $('undo').onclick=undo;

// ---------- 初始化
(async()=>{
  try{const r=await fetch('/api/annotations');doc=await r.json();doc.items ||= {};
    for(const it of Object.values(doc.items)){ // 舊格式轉換
      if(!it.entries){it.entries=(it.elevators||[]).map(e=>({type:'elevator',flow:null,...e}));delete it.elevators;}
      if('noElevator' in it){it.elevatorNone=!!it.noElevator;delete it.noElevator;}
      if('escalatorDone' in it){it.escalatorNone=!!it.escalatorDone&&!it.entries.some(e=>e.type==='escalator');delete it.escalatorDone;}
      it.elevatorNone ??= false; it.escalatorNone ??= false;
      if(!escs(it).length&&!it.escalatorNone)it.entries.push(newEntry('escalator','手扶梯'));} // 手扶梯預設開一個窗口
    doc.mirrorOff ||= {}; doc.version=3;$('status').textContent='已載入 '+Object.keys(doc.items).length+' 筆';}
  catch(e){$('status').className='err';$('status').textContent='⚠ 讀取失敗';}
  const q=new URLSearchParams(location.search).get('line'); if(q&&LINES.includes(q))filter=q; // 例如 ?line=松山新店線
  renderList();nextTodo();
})();
</script>
