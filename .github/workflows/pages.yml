# 把 app/ 部署成 GitHub Pages 靜態網站（無建置步驟）。
# 網站根網址 = 手機版介面；桌面版原型在 /desktop.html。
# 注意：app/data.private.js（車廂標記）已被 .gitignore 排除，不會進到庫裡，因此也不會被部署。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir _site
          cp -r app/. _site/
          rm -f _site/data.private.js          # 保險：就算被誤放進來也不部署
          mv _site/index.html _site/desktop.html
          cp _site/m.html _site/index.html     # 根網址 = 手機版
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
